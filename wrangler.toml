# スマホ実機で確認するための配信設定。
# 静的ファイルは dist/client をそのまま配り、/api/health と /api/mock/bootstrap だけ
# dist/server/index.js（Worker）が返す。どちらも npm run build で生成する。
name = "room-pilot"
main = "dist/server/index.js"
compatibility_date = "2026-08-12"

[assets]
directory = "./dist/client"
binding = "ASSETS"

# 公式LINEのトーク保存先。メッセージ・スレッド・冪等キーだけを置く
[[kv_namespaces]]
binding = "LINE_STORE"
id = "5a5b6bdeeab246559a692b169aa6c043"

# 会話の要約と条件整理。Cloudflare内で完結し、会話を外部のAI事業者へ渡さない
[ai]
binding = "AI"

# LINE_CHANNEL_SECRET / LINE_CHANNEL_ACCESS_TOKEN / ROOM_PILOT_LINE_KEY は
# ここへ書かず `wrangler secret put` で登録する（このファイルは公開リポジトリに入る）

[observability]
enabled = true
