<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta
      name="description"
      content="ROOM PILOTは、顧客・物件・内見・案件の次の一手をLINEから迷わず進める賃貸営業OSです。"
    />
    <meta property="og:title" content="ROOM PILOT｜LINE賃貸営業OS" />
    <meta
      property="og:description"
      content="次の一手が、今日わかる。顧客・物件・内見・案件をひとつにつなぐ賃貸営業OS。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ROOM PILOT｜LINE賃貸営業OS" />
    <meta
      name="twitter:description"
      content="次の一手が、今日わかる。顧客・物件・内見・案件をひとつにつなぐ賃貸営業OS。"
    />
    <meta name="twitter:image" content="/og.png" />
    <title>ROOM PILOT｜LINE賃貸営業OS</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="access-gate" class="access-gate" hidden></div>

    <div id="app-shell" class="app-shell" hidden>
      <header class="topbar">
        <div class="brand-block">
          <img
            class="brand-logo"
            src="/brand/header.png"
            width="613"
            height="96"
            alt="それ、LINEでええやん。｜不動産"
          />
          <span class="mock-badge">モック</span>
        </div>
        <div class="topbar-actions">
          <button class="user-chip" type="button" data-action="open-account" aria-haspopup="menu" aria-expanded="false">
            <span>佐藤</span>
            <span class="user-chip-caret" aria-hidden="true">⌄</span>
          </button>
          <span class="user-avatar" aria-label="ログイン中：佐藤">佐</span>
        </div>
      </header>

      <main id="app-view" class="app-view" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="メインメニュー">
        <button class="nav-item" type="button" data-tab="customers" aria-label="顧客">
          <span class="nav-icon" aria-hidden="true">♙</span>
          <span>顧客</span>
        </button>
        <button class="nav-item" type="button" data-tab="properties" aria-label="物件">
          <span class="nav-icon" aria-hidden="true">⌂</span>
          <span>物件</span>
        </button>
        <button class="nav-item nav-item-today" type="button" data-tab="today" aria-label="今日">
          <span class="today-orb"><span class="nav-icon" aria-hidden="true">✓</span></span>
          <span>今日</span>
        </button>
        <button class="nav-item" type="button" data-tab="viewings" aria-label="内見">
          <span class="nav-icon" aria-hidden="true">⌖</span>
          <span>内見</span>
        </button>
        <button class="nav-item" type="button" data-tab="cases" aria-label="案件">
          <span class="nav-icon" aria-hidden="true">▤</span>
          <span>案件</span>
        </button>
      </nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <div class="noscript-card">ROOM PILOTを利用するにはJavaScriptを有効にしてください。</div>
    </noscript>
  </body>
</html>
